env_file: .env

services:
  db:
    image: postgres:17-alpine
    container_name: vision-bolivia-db-dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vision_bolivia_dev}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      LANG: en_US.utf8
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vision_bolivia_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: node:22-alpine
    container_name: vision-bolivia-app-dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./web:/app
      - /app/node_modules
    command: >
      sh -c "npm install &&
             npx prisma generate &&
             npx prisma migrate dev &&
             npm run dev"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development
      PORT: ${PORT:-3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "${HOST_PORT:-23000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_dev_data:
